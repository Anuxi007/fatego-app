<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>FGO Codex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button id="backBtn" class="icon-btn hidden" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title" class="title">FGO Codex</h1>
    <div id="barActs" class="bar-acts"></div>
  </header>

  <div id="drawerShade" class="drawer-shade"></div>
  <nav id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">FGO <span class="accent">Codex</span></div>
    <div id="drawerItems"></div>
  </nav>

  <main id="view"></main>
  <div id="sheet" class="sheet hidden"></div>

  <div id="toast" class="toast" role="status"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
