plugins {
    id 'com.android.application'
}

// Every GitHub Actions build gets a higher versionCode, so the in-app updater can compare versions.
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.fgocodex.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fgocodex.app'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "2.0.${runNumber}"
    }

    signingConfigs {
        release {
            // The keystore is password-protected; the password lives only in the
            // KEYSTORE_PASSWORD repository secret.
            storeFile file('release.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias 'fgocodex'
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
