plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fgocodex.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fgocodex.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
