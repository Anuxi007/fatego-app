name: Update data index

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_drops:
        description: 'Rebuild drop locations now'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index
        run: python scripts/build_index.py
      - name: Daily-only steps?
        id: when
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%H)" = "06" ]; then echo "full=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build daily quests
        if: steps.when.outputs.full == '1'
        run: python scripts/build_daily.py

      - name: Build material drop locations (weekly)
        if: steps.when.outputs.full == '1'
        run: python scripts/build_drops.py ${{ github.event.inputs.force_drops == 'true' && '--force' || '' }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/strings.json data/daily.json data/drops.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data index"
          git push
