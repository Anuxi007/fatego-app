name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/index.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bundle Spanish translation
        run: |
          cp data/es.json app/src/main/assets/es.json
          cp data/daily.json app/src/main/assets/daily.json

      - name: Check signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FGO-Codex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FGO-Codex
          path: FGO-Codex.apk

      # Publishes the APK as a release so it can be downloaded directly from a phone
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FGO Codex (build ${{ github.run_number }})
          make_latest: true
          files: FGO-Codex.apk
