name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/index.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FGO-Codex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FGO-Codex
          path: FGO-Codex.apk

      # Publishes the APK as a release so it can be downloaded directly from a phone
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FGO Codex (build ${{ github.run_number }})
          make_latest: true
          files: FGO-Codex.apk
